:root{color-scheme:dark;--red:#ff3949;--muted:#9999a6}*{box-sizing:border-box}body{margin:0;background:#101013;color:#f6f5f7;font-family:'Malgun Gothic',sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #39393f;background:#242429;border-radius:12px;min-height:48px}button:hover{background:#34343b}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}header{display:flex;justify-content:space-between;align-items:center;padding:25px 4%;border-bottom:1px solid #2a2a30}.brand{font-weight:900;letter-spacing:3px;color:var(--red);font-size:19px}.brand span{font-weight:400;font-size:12px;color:#b8b8c4;letter-spacing:1px;margin-left:20px}.tools{display:flex;gap:10px}.tools button{padding:0 18px;font-size:14px}main{max-width:1600px;margin:auto;padding:26px 4% 20px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}h1{font-size:34px;letter-spacing:-1.5px;margin:0 0 8px}p{color:var(--muted);margin:0;font-size:14px}.badge{color:#dfdfe6;font-size:12px;background:#25252c;padding:9px 14px;border-radius:30px}.badge:before{content:'●';color:var(--red);margin-right:8px}.workspace{display:grid;grid-template-columns:106px 1fr;gap:22px}.meters{display:flex;flex-direction:column;gap:12px}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:2px;color:var(--muted);margin-bottom:2px}.meter{height:91px;display:flex;align-items:center;justify-content:center;gap:12px}.meter.active{background:var(--red);border-color:var(--red);box-shadow:0 6px 30px #ff39492a}.fraction{font-size:25px;line-height:1.05;font-weight:700;display:inline-flex;flex-direction:column}.fraction span:first-child{border-bottom:2px solid;padding-bottom:4px}.fraction span:last-child{padding-top:4px}.meter small{font-size:12px}.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 44% 75%,#29232a 0,#19191f 55%,#18181e 100%);border:1px solid #323239;border-radius:18px;height:414px}.stage-top{position:absolute;left:24px;top:20px;z-index:1}.stage-top strong{font-size:15px}.stage-top p{font-size:12px;margin-top:8px}.state{position:absolute;bottom:17px;left:22px;font-size:12px;color:#aaaab5}.state i{display:inline-block;width:6px;height:6px;background:#80808c;border-radius:50%;margin-right:7px}.running .state i{background:var(--red);box-shadow:0 0 12px var(--red)}#canvas{width:100%;height:100%;display:block}.diagram{position:absolute;right:20px;top:18px;width:150px;padding:13px;background:#121217c9;border:1px solid #33333b;border-radius:12px}.diagram .eyebrow{font-size:10px;letter-spacing:1px}.diagram svg{width:100%;height:115px}.diagram small{font-size:10px;color:#aaa}.beat-readout{position:absolute;right:34px;bottom:28px;text-align:right}.beat-readout b{font-size:72px;line-height:1}.beat-readout span{color:var(--muted);margin-left:8px;font-size:14px}.bottom{margin-top:18px;display:grid;grid-template-columns:215px 1fr;gap:20px;align-items:center}.transport{display:flex;gap:10px}.transport button{font-weight:700;padding:0 18px;height:60px}.transport #play{background:var(--red);border:0;flex:1}.transport #stop{width:60px;padding:0;font-size:22px}.beats{display:flex;gap:10px}.beat{flex:1;background:#202026;border:1px solid #383840;border-radius:12px;min-height:70px;display:flex;justify-content:center;align-items:center;gap:12px;color:#9999a6;transition:background .07s}.beat.lit{background:#4c222c;border-color:var(--red);color:#fff}.beat .symbol{font-size:29px}.beat .label{font-size:12px}.beat .label b{display:block;margin-bottom:4px;font-size:15px}.tempo{margin-top:24px;background:#1b1b21;border:1px solid #303038;border-radius:16px;padding:21px 25px}.tempo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.tempo-head strong{font-size:14px}.tempo-value{font-size:30px;font-weight:800;letter-spacing:-1px}.tempo-value small{font-size:12px;letter-spacing:1px;color:var(--muted);margin-left:7px}.slider-row{display:flex;gap:18px;align-items:center}.slider-row button{min-height:38px;width:40px;font-size:22px}.slider-row input{flex:1;min-width:0;accent-color:var(--red);height:28px;cursor:pointer}.range-label{display:flex;justify-content:space-between;margin:8px 58px 0;color:#aaaab5;font-size:12px}footer{display:flex;justify-content:space-between;margin-top:18px;color:#8c8c99;font-size:12px}kbd{background:#28282f;padding:3px 7px;border-radius:4px}#notice{color:#ffbec5;margin-top:10px;font-size:13px} @media(min-height:950px){.stage{height:510px}.meter{height:115px}}@media(max-width:800px){header{padding:16px}.brand span{display:none}main{padding:22px 16px}.workspace{grid-template-columns:75px 1fr;gap:12px}.meter{height:88px;gap:6px}.meter small{display:none}.stage{height:398px}.diagram{width:108px;right:10px}.diagram svg{height:85px}.stage-top{left:14px;max-width:120px}.bottom{grid-template-columns:1fr;gap:14px}.transport{max-width:260px}.beat{gap:5px}.beat .symbol{font-size:24px}footer{gap:15px}.intro .badge{display:none}h1{font-size:29px}}

/* Bright classroom theme */
:root{color-scheme:light;--red:#16834b;--muted:#637267}

</style></head><body><header><div class="brand">BEAT<span>우리 반 음악시간</span></div><div class="tools"><button id="sound" aria-pressed="true">♪ 소리 켜짐</button><button id="fullscreen">⛶ 전체 화면</button></div></header><main><div class="intro"><div><h1>박자 지휘기</h1><p>손을 따라, 소리에 맞춰. 빨간 자취로 지휘 모양을 익혀요.</p></div><div class="badge">오른손 거울 모드</div></div><div class="workspace"><nav class="meters" aria-label="박자 선택"><div class="eyebrow">박자 선택</div></nav><section><div class="stage"><div class="stage-top"><strong id="meterTitle">4분의 4박자</strong><p id="patternText">강 · 약 · 중강 · 약</p></div><svg id="canvas" viewBox="0 0 900 414" aria-label="오른손 거울 모드 지휘 애니메이션"><defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe4ba"/><stop offset="1" stop-color="#e9a66a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".35"/></filter></defs><g id="guide"></g><path id="completedTrail" fill="none" stroke="#e42e3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/><path id="trail" fill="none" stroke="#e42e3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g id="hand" filter="url(#shadow)"><path d="M-32 70 C-47 50 -61 30 -79 9 C-90 -4 -84 -18 -73 -17 C-63 -16 -52 1 -44 7 L-44 -63 C-44 -82 -23 -83 -23 -63 L-23 -88 C-23 -106 -1 -106 -1 -88 L-1 -96 C-1 -114 21 -113 21 -95 L21 -80 C21 -98 42 -96 42 -78 L42 -13 C42 17 46 43 29 69 L27 93 L-30 93 Z" fill="url(#skin)" stroke="#f7c996" stroke-width="2"/><path d="M-43 10 Q-18 15 -15 40 M-18 55 Q4 45 26 49" fill="none" stroke="#ca895d" stroke-width="3" stroke-linecap="round" opacity=".4"/><path d="M-31 80 L29 80 L34 111 L-37 111Z" fill="#edeef3"/><path d="M-37 101 L34 101 L41 148 L-44 148Z" fill="#454550"/></g></svg><div class="diagram"><div class="eyebrow">지휘 동선</div><svg id="mini" viewBox="0 0 240 180" aria-label="선택한 박자의 지휘 동선"></svg><small>화면과 같은 방향으로 따라 해요</small></div><div class="state"><i></i><span id="status">준비됐나요? 시작을 눌러요</span></div><div class="beat-readout"><b id="count">1</b><span id="total">/ 4</span></div></div><div class="bottom"><div class="transport"><button id="play">▶ 시작</button><button id="stop" aria-label="정지하고 첫 박으로">■</button></div><div class="beats" id="beats" aria-label="박자별 강약"></div></div></section></div><section class="tempo"><div class="tempo-head"><strong>메트로놈 속도 <span id="unit" style="color:#9999a6;font-weight:400;margin-left:12px">♩ = 1박</span></strong><div class="tempo-value"><span id="bpm">90</span><small>BPM</small></div></div><div class="slider-row"><button id="minus" aria-label="속도 5 줄이기">−</button><input id="tempo" type="range" min="40" max="200" value="90" aria-label="메트로놈 속도 BPM"><button id="plus" aria-label="속도 5 늘리기">+</button></div><div class="range-label"><span>느리게 · 40</span><span>빠르게 · 200</span></div></section><div id="notice" role="status"></div><footer><span>◎ 강 &nbsp; ○ 중강 &nbsp; ◌ 약 <span id="sixNote"></span></span><span><kbd>Space</kbd> 시작 / 일시정지 &nbsp; <kbd>Esc</kbd> 정지</span></footer></main><script>const $=s=>document.querySelector(s);
const configs={
 2:{den:4,acc:[2,0],points:[[440,290],[500,155]],routes:[
  [[[474,257],[495,207],[500,155]]],
  [[[500,122],[524,128],[514,153]],[[499,181],[460,164],[457,111]],[[451,96],[440,96],[440,100]],[[440,163],[440,226],[440,290]]]
 ]},
 3:{den:4,acc:[2,0,0],points:[[395,290],[505,238],[526,139]],routes:[
  [[[401,263],[401,195],[415,201]],[[443,223],[475,248],[505,238]]],
  [[[551,228],[551,174],[526,139]]],
  [[[535,219],[445,195],[395,100]],[[395,163],[395,226],[395,290]]]
 ]},
 4:{den:4,acc:[2,0,1,0],points:[[440,290],[330,242],[555,249],[555,170]],routes:[
  [[[440,256],[421,171],[397,211]],[[374,256],[331,263],[330,242]]],
  [[[293,181],[393,219],[443,240]],[[487,259],[530,265],[555,249]]],
  [[[579,226],[581,199],[555,170]]],
  [[[497,197],[456,186],[445,121]],[[442,110],[440,103],[440,100]],[[440,163],[440,226],[440,290]]]
 ]},
 6:{den:8,acc:[2,0,0,1,0,0],points:[[440,290],[398,246],[340,233],[491,249],[543,223],[517,121]],routes:[
  [[[436,263],[414,187],[408,203]],[[403,218],[403,239],[398,246]]],
  [[[386,257],[405,189],[393,200]],[[365,223],[326,257],[340,233]]],
  [[[357,156],[407,210],[439,234]],[[465,253],[498,270],[491,249]]],
  [[[493,240],[491,223],[491,215]],[[508,227],[529,237],[543,223]]],
  [[[560,206],[538,153],[517,121]]],
  [[[529,184],[466,190],[452,119]],[[447,107],[443,100],[440,100]],[[440,163],[440,226],[440,290]]]
 ]}
};
let meter=4,bpm=90,running=false,muted=false,ctx=null,origin=0,paused=0,scheduled=-1,timer=null,voices=[],lastBeat=-1;
const names=['약','중강','강'],symbols=['◌','○','◎'];
for(const n of [2,3,4,6]){let b=document.createElement('button');b.className='meter';b.dataset.meter=n;b.setAttribute('aria-label',`${configs[n].den}분의 ${n}박자`);b.innerHTML=`<span class="fraction"><span>${n}</span><span>${configs[n].den}</span></span><small>${n}박자</small>`;b.onclick=()=>select(n);$('.meters').append(b)}
function mix(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t)}
function cutCurve(a,curve,t){const [b,c,d]=curve,ab=mix(a,b,t),bc=mix(b,c,t),cd=mix(c,d,t),abc=mix(ab,bc,t),bcd=mix(bc,cd,t);return [ab,abc,mix(abc,bcd,t)]}
function segment(i,u=1){const start=configs[meter].points[i],curves=configs[meter].routes[i];let d='M'+start,a=start;const progress=Math.max(0,Math.min(1,u))*curves.length;for(let k=0;k<curves.length;k++){const t=Math.min(1,Math.max(0,progress-k));if(t<=0)break;const part=cutCurve(a,curves[k],t);d+=' C'+part.map(p=>p.join(',')).join(' ');a=curves[k][2]}return d}
function handPoint(i,u){const curves=configs[meter].routes[i],progress=Math.max(0,Math.min(1,u))*curves.length,k=Math.min(curves.length-1,Math.floor(progress)),t=progress-k;return cutCurve(k===0?configs[meter].points[i]:curves[k-1][2],curves[k],t)[2]}
function select(n){const was=running;halt(false);meter=n;paused=0;lastBeat=-1;document.querySelectorAll('.meter').forEach(b=>{b.classList.toggle('active',+b.dataset.meter===n);b.setAttribute('aria-pressed',+b.dataset.meter===n)});$('#meterTitle').textContent=`${configs[n].den}분의 ${n}박자`;$('#patternText').textContent=configs[n].acc.map(a=>names[a]).join(' · ');$('#total').textContent=`/ ${n}`;$('#unit').textContent=n===6?'♪ = 1작은박':'♩ = 1박';$('#sixNote').textContent=n===6?' · 6/8은 3+3 묶음의 6작은박 연습 모드':'';$('#beats').innerHTML=configs[n].acc.map((a,i)=>`<div class="beat"><span class="symbol">${symbols[a]}</span><span class="label"><b>${i+1}</b>${names[a]}</span></div>`).join('');$('#guide').innerHTML=configs[n].points.map((p,i)=>`<path d="${segment(i)}" fill="none" stroke="#a9b9ae" stroke-width="2" stroke-dasharray="5 8" opacity=".5"/><circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#ff6875" opacity=".5"/>`).join('');$('#mini').innerHTML=`<g transform="translate(-70,-15) scale(.44)">${configs[n].points.map((p,i)=>`<path d="${segment(i)}" fill="none" stroke="#e42e3b" stroke-width="4"/><circle cx="${p[0]}" cy="${p[1]}" r="17" fill="${i===0?'#16834b':'#71957d'}"/><text x="${p[0]}" y="${p[1]+7}" text-anchor="middle" fill="white" font-size="22">${i+1}</text>`).join('')}</g>`;draw(0);if(was)start()}
function time(){return ctx?ctx.currentTime:0}function position(){return running?(time()-origin)/(60/bpm):paused}
function clearSounds(){voices.forEach(v=>{try{v.stop()}catch{}});voices=[]}
function sound(t,index){if(muted)return;const accent=configs[meter].acc[index%meter],o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=[760,1050,1450][accent];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime([.12,.22,.34][accent],t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.075);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.08);voices.push(o);o.onended=()=>voices=voices.filter(v=>v!==o)}
function schedule(){if(!running)return;const dur=60/bpm,now=time();while(origin+(scheduled+1)*dur<now+.1){scheduled++;const t=origin+scheduled*dur;if(t>=now-.005)sound(Math.max(now,t),scheduled)}}
async function start(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(running)return;running=true;origin=time()-paused*60/bpm+.025;scheduled=Math.ceil(paused)-1;timer=setInterval(schedule,20);schedule();$('#play').textContent='Ⅱ 일시정지';$('.stage').classList.add('running');$('#status').textContent='손을 따라 함께 지휘해요';$('#notice').textContent=''}catch{$('#notice').textContent='소리를 시작할 수 없습니다. 브라우저의 소리 권한을 확인하고 다시 눌러 주세요.'}}
function halt(keep=true){if(running)paused=Math.max(0,position());running=false;clearInterval(timer);clearSounds();if(!keep)paused=0;$('#play').textContent='▶ 시작';$('.stage').classList.remove('running');$('#status').textContent=keep?'잠깐 쉬는 중 · 다시 시작해요':'준비됐나요? 시작을 눌러요';draw(paused)}
function draw(pos){pos=Math.max(0,pos);drawTrail(pos);let whole=Math.floor(pos),i=whole%meter,u=pos-whole,a=configs[meter].points[i],b=configs[meter].points[(i+1)%meter];const [x,y]=handPoint(i,u);$('#hand').setAttribute('transform',`translate(${x} ${y}) scale(.76) rotate(${(b[0]-a[0])*Math.sin(u*Math.PI)/45})`);if(lastBeat!==i){lastBeat=i;$('#count').textContent=i+1;document.querySelectorAll('.beat').forEach((b,j)=>b.classList.toggle('lit',j===i))}}

// The animation, accumulated red trace and miniature share these same cubic paths.
function trailPath(pos){const phase=((pos%meter)+meter)%meter,whole=Math.floor(phase),u=phase-whole;let d='';for(let j=0;j<whole;j++)d+=segment(j)+' ';if(u>0)d+=segment(whole,u);return d;}
function drawTrail(pos){
 $('#trail').setAttribute('d',trailPath(pos));
 // Show the completed shape across the bar boundary, then fade it as the next bar starts.
 const phase=pos%meter,opacity=pos>=meter?Math.max(0,1-phase/.8):0;
 $('#completedTrail').setAttribute('d',configs[meter].points.map((_,i)=>segment(i)).join(' '));
 $('#completedTrail').setAttribute('opacity',opacity);
}

function frame(){if(running)draw(position());requestAnimationFrame(frame)}
function tempo(value){const pos=Math.max(0,position());bpm=Math.max(40,Math.min(200,Number(value)));$('#tempo').value=bpm;$('#bpm').textContent=bpm;paused=pos;if(running){clearSounds();origin=time()-pos*60/bpm;scheduled=Math.floor(pos);schedule()}}
$('#play').onclick=()=>running?halt():start();$('#stop').onclick=()=>halt(false);$('#tempo').oninput=e=>tempo(e.target.value);$('#minus').onclick=()=>tempo(bpm-5);$('#plus').onclick=()=>tempo(bpm+5);$('#sound').onclick=()=>{muted=!muted;clearSounds();$('#sound').textContent=muted?'♪ 소리 꺼짐':'♪ 소리 켜짐';$('#sound').setAttribute('aria-pressed',!muted)};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('#notice').textContent='이 화면에서는 전체 화면을 지원하지 않습니다. 브라우저에서 F11을 눌러 주세요.'}};document.addEventListener('fullscreenchange',()=>$('#fullscreen').textContent=document.fullscreenElement?'⛶ 전체 화면 종료':'⛶ 전체 화면');document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(e.target.tagName)){e.preventDefault();running?halt():start()}if(e.key==='Escape')halt(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)halt()});select(4);frame();
</script></body></html>
